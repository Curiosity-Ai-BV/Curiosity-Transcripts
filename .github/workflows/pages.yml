name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    runs-on: macos-26
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check publication readiness
        run: bash scripts/check-publication-readiness.sh

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Configure Apple signing credentials
        run: ./scripts/configure-apple-signing-ci.sh

      - name: Build signed and notarized macOS DMG
        run: ./scripts/build-macos-dmg.sh

      - name: Stage latest DMG artifact
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"

          runner_arch="$(uname -m)"
          if [ "$runner_arch" != "arm64" ]; then
            echo "::error::Pages workflow names the DMG macos-aarch64 but the runner architecture is $runner_arch"
            exit 1
          fi

          mkdir -p pages-download
          dmg_path="apps/desktop/src-tauri/target/release/bundle/dmg/Curiosity Transcripts_${version}_aarch64.dmg"
          if [ ! -f "$dmg_path" ]; then
            echo "::error::Expected DMG was not produced: $dmg_path"
            exit 1
          fi
          cp "$dmg_path" pages-download/Curiosity-Transcripts-latest.dmg

          hdiutil verify pages-download/Curiosity-Transcripts-latest.dmg
          xcrun stapler validate pages-download/Curiosity-Transcripts-latest.dmg
          spctl -a -vvv -t open --context context:primary-signature pages-download/Curiosity-Transcripts-latest.dmg
          mount_dir="$(mktemp -d)"
          cleanup_mount() {
            if [ -n "${mount_dir:-}" ] && [ -d "$mount_dir" ]; then
              hdiutil detach "$mount_dir" || true
              rm -rf "$mount_dir"
            fi
          }
          trap cleanup_mount EXIT
          hdiutil attach pages-download/Curiosity-Transcripts-latest.dmg -readonly -nobrowse -mountpoint "$mount_dir"
          if [ ! -d "$mount_dir/Curiosity Transcripts.app" ]; then
            echo "::error::Pages latest DMG is missing Curiosity Transcripts.app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$mount_dir/Curiosity Transcripts.app"
          spctl -a -vvv -t exec "$mount_dir/Curiosity Transcripts.app"
          hdiutil detach "$mount_dir"
          rm -rf "$mount_dir"
          mount_dir=""
          trap - EXIT

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-transcripts-dmg
          path: pages-download/Curiosity-Transcripts-latest.dmg
          if-no-files-found: error

  build-pages:
    runs-on: ubuntu-latest
    needs: build-macos-dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest DMG
        uses: actions/download-artifact@v4
        with:
          name: curiosity-transcripts-dmg
          path: site/downloads

      - name: Verify Pages download path
        run: test -s site/downloads/Curiosity-Transcripts-latest.dmg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
