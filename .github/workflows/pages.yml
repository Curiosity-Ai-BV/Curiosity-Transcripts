name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build unsigned macOS DMG
        run: ./scripts/build-macos-dmg.sh --no-sign

      - name: Stage latest DMG artifact
        run: |
          mkdir -p pages-download
          dmg_path="$(find apps/desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "::error::No DMG was produced"
            exit 1
          fi
          cp "$dmg_path" pages-download/Curiosity-Transcripts-latest.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-transcripts-dmg
          path: pages-download/Curiosity-Transcripts-latest.dmg
          if-no-files-found: error

  build-pages:
    runs-on: ubuntu-latest
    needs: build-macos-dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest DMG
        uses: actions/download-artifact@v4
        with:
          name: curiosity-transcripts-dmg
          path: site/downloads

      - name: Verify Pages download path
        run: test -s site/downloads/Curiosity-Transcripts-latest.dmg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
