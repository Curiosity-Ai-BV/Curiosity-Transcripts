name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release-dmg:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check release version sources
        run: node scripts/check-release-workflow.js

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build unsigned macOS DMG
        run: ./scripts/build-macos-dmg.sh --no-sign

      - name: Stage versioned release assets
        id: stage_assets
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"

          runner_arch="$(uname -m)"
          if [ "$runner_arch" != "arm64" ]; then
            echo "::error::Release workflow names the DMG macos-aarch64 but the runner architecture is $runner_arch"
            exit 1
          fi

          mkdir -p release-assets
          dmg_path="apps/desktop/src-tauri/target/release/bundle/dmg/Curiosity Transcripts_${version}_aarch64.dmg"
          if [ ! -f "$dmg_path" ]; then
            echo "::error::Expected DMG was not produced: $dmg_path"
            exit 1
          fi

          release_asset="release-assets/Curiosity-Transcripts-${version}-macos-aarch64.dmg"
          cp "$dmg_path" "$release_asset"

          hdiutil verify "$release_asset"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$release_asset" -readonly -nobrowse -mountpoint "$mount_dir"
          if [ ! -d "$mount_dir/Curiosity Transcripts.app" ]; then
            echo "::error::Release DMG is missing Curiosity Transcripts.app"
            hdiutil detach "$mount_dir" || true
            rm -rf "$mount_dir"
            exit 1
          fi
          hdiutil detach "$mount_dir"
          rm -rf "$mount_dir"

          shasum -a 256 "$release_asset" | tee "$release_asset.sha256"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_path=$release_asset" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$release_asset.sha256" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.stage_assets.outputs.version }}
          ASSET_PATH: ${{ steps.stage_assets.outputs.asset_path }}
          CHECKSUM_PATH: ${{ steps.stage_assets.outputs.checksum_path }}
        run: |
          release_notes="$(mktemp)"
          {
            echo "Curiosity Transcripts ${RELEASE_VERSION}"
            echo
            echo "Unsigned macOS DMG for testing the open-source release path."
            echo "Signed and notarized distribution remains a separate release step."
          } > "$release_notes"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Curiosity Transcripts ${RELEASE_VERSION}" \
              --notes-file "$release_notes"
          else
            gh release create "$RELEASE_TAG" \
              --title "Curiosity Transcripts ${RELEASE_VERSION}" \
              --notes-file "$release_notes"
          fi

          gh release upload "$RELEASE_TAG" "$ASSET_PATH" "$CHECKSUM_PATH" --clobber
