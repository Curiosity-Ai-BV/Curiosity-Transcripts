[package]
name = "curiosity-desktop"
version = "0.1.18"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Curiosity-Ai-BV/Curiosity-Transcripts"
homepage = "https://github.com/Curiosity-Ai-BV/Curiosity-Transcripts"

[features]
default = ["whisper-rs"]
whisper-rs = ["curiosity-transcription/whisper-rs"]
system-audio-screencapturekit = ["curiosity-audio/system-audio-screencapturekit"]

[dependencies]
curiosity-app = { path = "../../../crates/app" }
curiosity-analysis = { path = "../../../crates/analysis" }
curiosity-audio = { path = "../../../crates/audio" }
curiosity-domain = { path = "../../../crates/domain" }
curiosity-store = { path = "../../../crates/store" }
curiosity-transcription = { path = "../../../crates/transcription" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
ureq = { version = "2", default-features = false, features = ["json"] }
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
