[package]
name = "curiosity-audio"
version = "0.1.3"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
system-audio-screencapturekit = ["dep:screencapturekit"]

[lib]
name = "curiosity_audio"
path = "src/lib.rs"

[dependencies]
hound = "3.5.1"
sha2 = "0.10.8"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.17.3"
screencapturekit = { version = "6.0.1", features = ["macos_13_0"], optional = true }
