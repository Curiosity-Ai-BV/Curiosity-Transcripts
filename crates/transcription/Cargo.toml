[package]
name = "curiosity-transcription"
version = "0.1.0"
edition = "2021"

[lib]
name = "curiosity_transcription"
path = "src/lib.rs"

[features]
default = []
whisper-rs = ["dep:whisper-rs"]

[dependencies]
curiosity-domain = { path = "../domain" }
hound = "3.5.1"
serde_json = "1"
whisper-rs = { version = "0.16", optional = true }
