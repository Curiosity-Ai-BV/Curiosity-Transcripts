[package]
name = "curiosity-transcription"
version = "0.1.2"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "curiosity_transcription"
path = "src/lib.rs"

[features]
default = []
whisper-rs = ["dep:whisper-rs"]

[dependencies]
curiosity-domain = { path = "../domain" }
hound = "3.5.1"
serde_json = "1"
sha2 = "0.10.8"
whisper-rs = { version = "0.16", optional = true }
